# VideoController display settings - cosmetic/runtime preferences only.
# Deliberately NOT here: memory-map addresses, register layout, anything
# BIOS.asm/MONITOR.asm/bdos.cfg/simplecpu.cfg also need to agree on - those
# are a frozen ABI shared across Java and the 6502 assembly/C sources, and
# belong as compile-time constants, not something one side of that contract
# could change without the other noticing.

# Font
video.font.name=Monospaced
video.font.size=16

# Colors - R,G,B (0-255 each). java.awt.Color has no GOLD constant (that's a
# JavaFX/CSS name, not AWT) - 255,215,0 is the standard web "Gold" value.
video.color.text=255,215,0
video.color.background=0,0,0

# How often the Swing Timer repaints, standing in for a real CRTC's
# continuous raster scan (see VideoController's class comment).
video.refresh.ms=33

# Empty space in pixels around the text grid on every side.
video.border=5

# Initial window size, in character cells, before the first real register
# values (set by BIOS_VIDEO_INIT) are known - NOT the same thing as R1/R6
# Horizontal/Vertical Displayed, which is what actually governs rendering
# once the firmware has run. Purely a startup sizing hint.
video.columns=80
video.rows=24
