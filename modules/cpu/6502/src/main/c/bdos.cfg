# cc65 linker config for BDOS - a second ROM+RAM split alongside
# simplecpu.cfg's (which is for RAM-loaded programs like CCP.COM/hello.c).
# See Doc/Architecture.md for the full memory map this has to agree with.
#
# Two separate memory areas, not one:
#   ROM ($A000-$B7FF)  BDOS's actual code - the jump table (bdos_jumptable.s,
#                      placed first so it lands exactly at $A000) plus
#                      bdos.c's compiled functions. This is what cl65
#                      produces as bdos.bin and what CPUMain/Test_BIOS load
#                      into a basicROM (genuinely write-protected at
#                      runtime, same as BIOS.hex/MONITOR.hex). Sized at
#                      6KB, generously past what BDOS actually uses today -
#                      $A000-$EBFF is otherwise entirely free address space
#                      (see Doc/Architecture.md's memory map), so there's
#                      no pressure to size this tightly the way a boot
#                      image once was.
#   WORKRAM ($8000-$81FF)  bdos.c's own working state (sector_buf, the
#                      directory-scan position, the "currently open file"
#                      block list) - this has to be real writable RAM, not
#                      part of the ROM chip above, since BDOS's static
#                      variables get written to at runtime. Named WORKRAM
#                      rather than BSS - a MEMORY area and a SEGMENT sharing
#                      the name "BSS", both with define=yes, made ld65
#                      generate __BSS_SIZE__ etc. twice ("Duplicate external
#                      identifier"). "file=" (empty) means ld65 does NOT put
#                      this region's bytes into bdos.bin at all - there's
#                      nothing to burn into ROM for a BSS region, Java's
#                      basicMemory backing array starts zeroed anyway (same
#                      effective result crt0's zero-bss loop would give, if
#                      anything ever ran it - see below). CPUMain/Test_BIOS
#                      register a plain basicMemory here, not a basicROM.
#
# Zero page is the SAME range as simplecpu.cfg's - this has to match for
# cc65's calling convention (the software stack pointer, ptr1-4, etc.) to
# behave consistently whether BDOS is JSR'd into from MONITOR.asm directly
# or from another cc65-compiled program's own code. Starts at $000E, not
# $0009, to actually reserve $09-$0D for BIOS.asm's own row/column tracking
# for VideoController - see simplecpu.cfg's comment for why that reservation
# is a real functional requirement now, not just a cosmetic convention.
#
# BDOS has no STARTUP-segment entry point anything ever JSRs to - only the
# jump table's individual slots are called, directly, by fixed address -
# so crt0's usual sp-init/zero-bss/call-main sequence never actually runs
# here. That's fine for bss (Java zero-initializes a fresh backing array
# regardless) but means BDOS's own compiled functions must never depend on
# cc65's software stack being pre-initialized by ITS OWN crt0 - see the file
# comment in bdos.c for how that's avoided (no local arrays there).
MEMORY {
    ZP:      start = $000E, size = $00F2, type = rw, define = yes;
    ROM:     start = $A000, size = $1800, type = ro, define = yes, file = %O;
    WORKRAM: start = $8000, size = $0200, type = rw, define = yes, file = "";
}

SEGMENTS {
    ZEROPAGE:  load = ZP,  type = zp;
    JUMPTABLE: load = ROM, type = ro, define = yes;
    STARTUP:   load = ROM, type = ro, define = yes;
    LOWCODE:   load = ROM, type = ro, optional = yes;
    ONCE:      load = ROM, type = ro, optional = yes;
    CODE:      load = ROM, type = ro, define = yes;
    RODATA:    load = ROM, type = ro;
    DATA:      load = ROM, run = WORKRAM, type = rw, define = yes;
    BSS:       load = WORKRAM, type = bss, define = yes;
}

FEATURES {
    CONDES: segment = STARTUP,
            type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = STARTUP,
            type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__;
}

SYMBOLS {
    # Dead weight here - nothing ever runs crt0's startup code, so this
    # value is never actually read - but cc65's library code references
    # these symbols unconditionally, so they still need to resolve to
    # something for the link to succeed.
    __STACKSTART__: type = weak, value = $8000;
    __STACKSIZE__:  type = weak, value = $0800;
}
