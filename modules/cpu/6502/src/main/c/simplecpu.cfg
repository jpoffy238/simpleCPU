# Custom cc65 linker config for simpleCPU's emulated machine - not a stock
# cc65 target (c64/apple2/etc.), since this is our own custom hardware. See
# Doc/Architecture.md for the full memory map this has to agree with.
#
# Zero page: MONITOR.asm's hand-written variables (command-line parsing
# state, the E command's self-modifying-JSR scratch) live at $00-$08. DOS and
# the monitor never run concurrently - it's a sequential handoff (the monitor
# boots DOS via B; the monitor's own code then sits dormant in ROM, not
# executing) - so there's no *functional* requirement to avoid those bytes.
# Starting cc65's own ZEROPAGE segment at $09 anyway is just so a memory dump
# during development isn't ambiguous about which half owns which bytes.
#
# RAM: programs load at $0400 (Doc/Architecture.md's "free RAM" region;
# BOOTADDR itself, $0300, is a 128-byte landing pad sized for one disk
# sector, nowhere near big enough for a real C program - see the "Phase 2"
# multi-sector boot note there, still unsolved, so getting a cc65-built
# binary onto disk and actually loaded via B is a separate problem from
# everything in this file).
MEMORY {
    ZP:  start = $0009, size = $00F7, type = rw, define = yes;
    RAM: start = $0400, size = $7C00, type = rw, define = yes, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = RAM, type = ro, define = yes;
    LOWCODE:  load = RAM, type = ro, optional = yes;
    ONCE:     load = RAM, type = ro, optional = yes;
    CODE:     load = RAM, type = ro, define = yes;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw, define = yes;
    BSS:      load = RAM, type = bss, define = yes;
}

FEATURES {
    CONDES: segment = STARTUP,
            type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = STARTUP,
            type = destructor,
            label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__;
}

SYMBOLS {
    # cc65's own software stack (parameters/locals) - separate from the 6502
    # hardware stack, which always stays at $0100-$01FF regardless. crt0.s
    # (the "none" target's startup code) initializes its stack pointer from
    # __STACKSTART__ directly - it's an address, not a size, and grows
    # downward from there. $8000 is one past the end of our RAM region
    # ($0400-$7FFF), so the first push lands at $7FFF, the actual last valid
    # byte. __STACKSIZE__ isn't referenced by crt0.s itself (only
    # __STACKSTART__ was - this was the unresolved symbol on the first build
    # attempt) but is kept since some cc65 library code checks it.
    __STACKSTART__: type = weak, value = $8000;
    __STACKSIZE__:  type = weak, value = $0800;
}
